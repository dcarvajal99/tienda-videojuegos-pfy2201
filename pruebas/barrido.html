<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Barrido de anchos</title></head>
<body style="margin:0">
<iframe id="marco" src="tienda-videojuegos-pfy2201/" title="Tienda" style="border:0;height:900px;width:1280px"></iframe>
<script>
(async () => {
    const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
    const marco = document.getElementById('marco');
    while (!(marco.contentDocument && marco.contentDocument.querySelector('#catalogo article'))) await esperar(100);
    const resultados = [];
    for (let ancho = 320; ancho <= 1680; ancho += 40) {
        marco.style.width = ancho + 'px';
        await esperar(150);
        const raiz = marco.contentDocument.documentElement;
        resultados.push({ ancho, extra: raiz.scrollWidth - raiz.clientWidth });
    }
    await fetch('/resultado?nav=barrido-firefox', { method: 'POST', body: JSON.stringify({ nav: 'barrido-firefox', resultados }) });
})();
</script>
</body></html>
