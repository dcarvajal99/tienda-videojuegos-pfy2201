<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 88" width="292" height="88">
  <!-- Mando: contorno de 2.5px, sin relleno ni degradados -->
  <rect x="1.5" y="21.5" width="68" height="45" rx="16"
        fill="none" stroke="#18181b" stroke-width="2.5"/>
  <!-- Cruceta -->
  <rect x="13" y="41.5" width="19" height="5" rx="2.5" fill="#18181b"/>
  <rect x="20" y="34.5" width="5" height="19" rx="2.5" fill="#18181b"/>
  <!-- Botones: el único punto de color de toda la marca -->
  <circle cx="47" cy="39" r="4" fill="#18181b"/>
  <circle cx="57" cy="49" r="4" fill="#2d1b69"/>
  <!-- Marca denominativa -->
  <text x="88" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30"
        font-weight="700" letter-spacing="-0.6" fill="#18181b">PixelPlay</text>
  <text x="89" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10"
        letter-spacing="3.4" fill="#52525b">TIENDA DE VIDEOJUEGOS</text>
</svg>
